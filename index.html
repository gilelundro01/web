<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Claude Chat</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo-dot"></span>
      <span class="brand-text">Claude</span>
    </div>
    <div class="controls">
      <label for="model" class="sr-only">Model</label>
      <select id="model" title="Pilih model" aria-label="Pilih model"></select>
      <button id="clear-btn" type="button" class="icon-btn" title="Mulai chat baru" aria-label="Mulai chat baru">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </div>
  </header>

  <main id="chat" class="chat" aria-live="polite"></main>

  <div class="composer-wrap">
    <form id="composer" class="composer" autocomplete="off">
      <textarea
        id="input"
        rows="1"
        placeholder="Tanya apa saja…"
        required
      ></textarea>
      <button id="send-btn" type="submit" class="send-btn" title="Kirim" aria-label="Kirim">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5M5 12l7-7 7 7" />
        </svg>
      </button>
    </form>
    <div class="hint">Enter untuk kirim · Shift+Enter baris baru</div>
  </div>

  <script src="assets/app.js" defer></script>
</body>
</html>
