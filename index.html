<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0d0e10" />
  <title>Claude Chat</title>
  <link rel="stylesheet" href="assets/style.css" />
  <!-- Syntax highlighting (loaded async; renderer no-ops if not yet ready) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js"
          defer></script>
</head>
<body>
  <!-- ========== Mobile-only top bar ========== -->
  <header class="topbar">
    <button id="sidebar-toggle" type="button" class="icon-btn" title="Buka menu" aria-label="Buka menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6h18M3 12h18M3 18h18" />
      </svg>
    </button>
    <div class="brand">
      <span class="logo-dot"></span>
      <span class="brand-text">Claude</span>
    </div>
    <button id="new-chat-mobile" type="button" class="icon-btn" title="Chat baru" aria-label="Chat baru">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>
  </header>

  <!-- ========== Sidebar (conversation list) ========== -->
  <aside id="sidebar" class="sidebar" aria-label="Daftar percakapan">
    <div class="sidebar-header">
      <div class="brand">
        <span class="logo-dot"></span>
        <span class="brand-text">Claude</span>
      </div>
      <button id="sidebar-close" type="button" class="icon-btn sidebar-close-btn" title="Tutup menu" aria-label="Tutup menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
    <button id="new-chat-btn" type="button" class="new-chat-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14" />
      </svg>
      Chat baru
    </button>
    <div id="conv-list" class="conv-list" aria-live="polite"></div>
    <div class="sidebar-footer">
      <label for="model" class="model-label">Model</label>
      <select id="model" title="Pilih model" aria-label="Pilih model"></select>
    </div>
  </aside>

  <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

  <!-- ========== Main chat area ========== -->
  <main class="main">
    <div id="chat" class="chat" aria-live="polite"></div>

    <div class="composer-wrap">
      <form id="composer" class="composer" autocomplete="off">
        <div id="attachments-bar" class="attachments-bar" hidden></div>
        <div class="composer-row">
          <button id="attach-btn" type="button" class="attach-btn" title="Lampirkan file/gambar" aria-label="Lampirkan file atau gambar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
            </svg>
          </button>
          <input id="file-input" type="file" multiple
                 accept="image/jpeg,image/png,image/gif,image/webp,.txt,.md,.json,.csv,.log,.html,.css,.js,.ts,.py,.php,.java,.c,.cpp,.go,.rs,.sh,.yaml,.yml,.xml"
                 hidden />
          <textarea
            id="input"
            rows="1"
            placeholder="Tanya apa saja…"
          ></textarea>
          <button id="send-btn" type="submit" class="send-btn" title="Kirim" aria-label="Kirim">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5M5 12l7-7 7 7" />
            </svg>
          </button>
        </div>
      </form>
      <div class="hint">Enter untuk kirim · Shift+Enter baris baru</div>
    </div>
  </main>

  <script src="assets/app.js" defer></script>
</body>
</html>
